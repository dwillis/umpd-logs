<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{% block title %}Learn{% endblock %} — UMD Police Activity</title>
		<link rel="stylesheet" href="../../static/style.css" />
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<script>window.LEARN = {{ learn|tojson }};</script>
	</head>
	<body>
		<div id="top-header">
			<div id="header">UMD Police Activity Log with Arrests</div>
		</div>
		<nav id="site-nav">
			<div id="nav-inner">
				<a href="../../" class="nav-link">Activity Log</a>
				<a href="../../trends/" class="nav-link">Trends &amp; Patterns</a>
				<a href="../../compare/" class="nav-link">Compare</a>
				<a href="../" class="nav-link nav-active">Learn</a>
				<a href="../../exercises/" class="nav-link">Exercises</a>
			</div>
		</nav>
		<div id="container">
			<div class="byline">
				A statistics classroom built on real UMPD data, updated daily. <a href="https://github.com/dwillis/umpd-logs">See the code</a>
			</div>
			{% block content %}{% endblock %}
			<p class="learn-footer-note">Data through {{ learn.generated_at }} · <a href="../">All lessons</a></p>
		</div>
		<footer>
			<div id="footer-text">Copyright 2022-2026</div>
		</footer>
		<script src="../../static/learn.js"></script>
	</body>
</html>
